<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Màn hình giới thiệu bài học của OpenQuiz."
    />
    <title>Bắt đầu bài học | OpenQuiz</title>
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/variables.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body>
    <a class="oq-skip-link" href="#intro-content">Đi tới nội dung chính</a>

    <main class="oq-intro">
      <div class="oq-intro__orbits" aria-hidden="true">
        <span class="oq-intro__orbit oq-intro__orbit--outer"></span>
        <span class="oq-intro__orbit oq-intro__orbit--middle"></span>
        <span class="oq-intro__orbit oq-intro__orbit--inner"></span>
        <span class="oq-intro__node oq-intro__node--blue"></span>
        <span class="oq-intro__node oq-intro__node--mint"></span>
        <span class="oq-intro__node oq-intro__node--center"></span>
      </div>

      <div
        class="oq-intro__floating-card oq-intro__floating-card--left"
        aria-hidden="true"
      >
        <span class="oq-intro__floating-icon oq-intro__floating-icon--blue">
          <span class="oq-icon oq-icon--school"></span>
        </span>
        <span class="oq-intro__skeleton">
          <i></i>
          <i></i>
        </span>
      </div>

      <div
        class="oq-intro__floating-card oq-intro__floating-card--right-top"
        aria-hidden="true"
      >
        <span class="oq-intro__floating-icon oq-intro__floating-icon--mint">
          <span class="oq-icon oq-icon--signal"></span>
        </span>
        <span class="oq-intro__skeleton">
          <i></i>
          <i></i>
        </span>
      </div>

      <div
        class="oq-intro__floating-card oq-intro__floating-card--right-bottom"
        aria-hidden="true"
      >
        <span class="oq-intro__floating-icon oq-intro__floating-icon--blue">
          <span class="oq-icon oq-icon--description"></span>
        </span>
        <span class="oq-intro__skeleton oq-intro__skeleton--compact">
          <i></i>
          <i></i>
        </span>
      </div>

      <section
        id="intro-content"
        class="oq-intro__content"
        aria-labelledby="intro-title"
      >
        <p class="oq-intro__eyebrow">Bài học hôm nay</p>

        <h1 id="intro-title" class="oq-intro__title">
          <span class="oq-intro__title-line">
            Sẵn sàng bắt đầu
            <span class="oq-intro__signal" aria-hidden="true">
              <i></i><i></i><i></i>
            </span>
          </span>
          <span class="oq-intro__title-line">hành trình học tập?</span>
        </h1>

        <p class="oq-intro__description">
          Khám phá kiến thức mới, luyện tập qua câu hỏi tương tác<br
            class="oq-intro__desktop-break"
          />
          và theo dõi tiến độ của bạn.
        </p>

        <ul class="oq-intro__meta" role="list" aria-label="Thông tin bài học">
          <li class="oq-intro__meta-item">
            <span class="oq-intro__meta-icon" aria-hidden="true">
              <span class="oq-icon oq-icon--schedule"></span>
            </span>
            <span>15 phút</span>
          </li>
          <li class="oq-intro__meta-item">
            <span class="oq-intro__meta-icon" aria-hidden="true">
              <span class="oq-icon oq-icon--description"></span>
            </span>
            <span>10 câu hỏi</span>
          </li>
          <li class="oq-intro__meta-item">
            <span class="oq-intro__meta-icon" aria-hidden="true">
              <span class="oq-icon oq-icon--signal"></span>
            </span>
            <span>Cơ bản</span>
          </li>
        </ul>

        <a
          class="oq-btn oq-btn--primary oq-btn--lg oq-intro__cta"
          href="./study.html"
        >
          <span>Bắt đầu học</span>
          <span class="oq-icon oq-icon--arrow" aria-hidden="true"></span>
        </a>
      </section>
    </main>
  </body>
</html>
